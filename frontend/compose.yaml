services:
  frontend:
    build:
      context: .
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/backend}
    environment:
      BACKEND_PROXY_TARGET: ${BACKEND_PROXY_TARGET:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:80"
    restart: unless-stopped

services:
  postgres:
    build: ./database
    
    container_name: ${POSTGRES_CONTAINER_NAME:-database_EcoByteMetrics}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT_CONTEINER}:${POSTGRES_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env

    container_name: ecobytemetrics-backend
    restart: unless-stopped

    environment:
      PORT: ${PORT}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "${PORT_CONTEINER}:${PORT}"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecobytemetrics-frontend
    restart: unless-stopped
    environment:
      BACKEND_PROXY_TARGET: http://backend:${PORT:-3000}

    ports:
      - "${FRONT_PORT}:${PGPORT}"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:

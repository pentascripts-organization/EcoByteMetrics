services:

  postgres:
    build: ./database
    
    container_name: database_EcoByteMetrics
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-ecobytemetrics}
      POSTGRES_USER: ${POSTGRES_USER:-ecobyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecobytemetrics}

    ports:
      - "5433:${POSTGRES_PORT:-5432}"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env

    container_name: ecobytemetrics-backend
    restart: unless-stopped

    environment:
      PORT: ${PORT:-3000}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-ecobytemetrics}
      POSTGRES_USER: ${POSTGRES_USER:-ecobyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecobytemetrics}

      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecobytemetrics-frontend
    restart: unless-stopped

    ports:
      - "${FRONT_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:
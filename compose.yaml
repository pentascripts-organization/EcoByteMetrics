services:

  postgres:
    image: postgres:18-alpine
    container_name: database_EcoByteMetrics
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecobytemetrics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecobytemetrics"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ecobytemetrics-backend
    restart: unless-stopped

    environment:
      PORT: 3000

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ecobytemetrics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecobytemetrics-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data: